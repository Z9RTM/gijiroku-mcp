<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>gijiroku-mcp</title>
<style>
:root{color-scheme:light dark;--bg:#fbfaf7;--surface:#fff;--text:#292a25;--muted:#74766b;--line:#e6e7df;--accent:#21654d;--soft:#e8f0e9;--danger:#ab3a32;font-family:var(--font-sans,system-ui,-apple-system,sans-serif);font-size:14px}
:root[data-theme=dark]{--bg:#20221f;--surface:#282b26;--text:#f0f1e8;--muted:#afb5a5;--line:#42473d;--accent:#98d4b0;--soft:#344839;--danger:#ffb2a7}
*{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--bg)}main{padding:22px;max-width:900px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}h1{font-size:21px;letter-spacing:-.6px;margin:0}header p{margin:5px 0 0;color:var(--muted);font-size:12px}.badge{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:7px 10px;font-size:12px;white-space:nowrap}.dot{width:7px;height:7px;background:var(--muted);border-radius:50%}.badge[data-active=true] .dot{background:var(--accent)}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}button{font:inherit;font-weight:600;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);padding:10px 14px;cursor:pointer}button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}button.stop{color:var(--danger)}button:disabled{opacity:.4;cursor:default}button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.model{background:var(--soft);border-radius:9px;padding:12px 14px;margin-bottom:16px}.model-row{display:flex;justify-content:space-between;gap:12px;font-size:12px}.model progress{width:100%;height:6px;accent-color:var(--accent);display:block;margin-top:9px}.transcript{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}.transcript-heading{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:12px}.transcript-heading span{color:var(--muted);font-variant-numeric:tabular-nums}#text{height:260px;overflow:auto;padding:16px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}#final:empty::before{content:'録音を開始すると、ここに文字起こしが表示されます。';color:var(--muted)}#pending{color:var(--muted);margin-top:12px}.pending-label{font-size:11px;letter-spacing:.05em;color:var(--muted)}#pending:empty{display:none}footer{color:var(--muted);font-size:11px;line-height:1.6;margin-top:12px}#error{border-left:3px solid var(--danger);color:var(--danger);padding:9px 12px;background:var(--surface);margin-bottom:12px;white-space:pre-wrap;overflow-wrap:anywhere}#notice{color:var(--muted);font-size:12px;min-height:20px;margin:0 0 10px}details{font-size:12px;color:var(--muted);margin-top:14px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:150px;overflow:auto}#scope{font-size:11px;color:var(--muted);margin-top:8px}[hidden]{display:none!important}@media(max-width:440px){main{padding:14px}header{align-items:flex-start}.badge{font-size:11px}button{padding:10px 12px}#text{height:230px}}
</style>
</head>
<body><main>
<header><div><h1>gijiroku-mcp</h1><p>端末内で、日本語を文字に。</p></div><div class="badge" id="badge"><span class="dot"></span><span id="phase" role="status">接続中</span></div></header>
<label>話者ラベル <select id="diarize"><option value="">付けない</option><option value="nemotron-3-diarization" selected>8人以下（Nemotron 3）</option><option value="fastdiar-large">9人以上・人数不明（FASTDIAR）</option></select></label> <label>マイク <select id="mic"><option value="">既定のマイク</option></select></label><p id="speaker-status" role="status"></p>
<div class="controls"><button id="start" class="primary" disabled>録音を開始</button><button id="stop" class="stop" disabled>停止</button><button id="prepare" disabled>モデルを準備</button><button id="refresh" disabled>更新</button></div>
<div id="error" role="alert" hidden></div><p id="notice" role="status">状態を確認しています…</p>
<section class="model" aria-label="音声認識モデル"><div class="model-row"><span id="model-label">モデルを確認中</span><span id="model-size"></span></div><progress id="progress" max="100" aria-label="モデル取得の進捗"></progress></section>
<section class="transcript" aria-label="文字起こし"><div class="transcript-heading"><strong>文字起こし</strong><span id="time">録音待機中</span></div><div id="text" tabindex="0" aria-label="文字起こし本文"><div id="final"></div><div id="pending"></div></div></section>
<p id="scope" hidden>長い録音は直近の64 KiB分を表示します。全文のイベントは端末に保存されています。</p>
<p id="recording-id" style="font-size:11px;overflow-wrap:anywhere"></p>
<details><summary>詳細ログ</summary><pre id="logs"></pre></details>
<footer>録音は「停止」を押すまで続きます。音声は保存せず、認識した文章を端末に保存します。<br>画面を閉じてもMCP接続が続いている間は録音が続きます。終了するには「停止」を押してください。</footer>
</main><script>/* APP_SCRIPT */</script></body></html>
